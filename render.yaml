# Blueprint do Render — define o web service + cron job de atualização.
# 1) Faz push deste repo para o GitHub
# 2) No Render: New → Blueprint → escolhe o repo → aplica
services:
  - type: web
    name: cripto-etfs-nav
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend_app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: REFRESH_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cripto-etfs-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

  # Cron: atualiza os NAVs uma vez por dia útil na janela 9h-18h Lisboa.
  # O plano free do Render só corre crons pagos; alternativa gratuita:
  # usar https://cron-job.org a apontar para /refresh?token=...
  - type: cron
    name: cripto-etfs-nav-refresh
    runtime: python
    plan: starter   # crons são pagos no Render; ver nota acima
    schedule: "0 10,17 * * 1-5"
    buildCommand: pip install requests curl_cffi
    startCommand: python -c "import os,requests;u=os.environ['SERVICE_URL']+'/refresh?token='+os.environ['REFRESH_TOKEN'];print(requests.get(u,timeout=90).text)"
    envVars:
      - key: SERVICE_URL
        fromService:
          name: cripto-etfs-nav
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: REFRESH_TOKEN
        sync: false

databases:
  - name: cripto-etfs-db
    plan: free
    databaseName: cripto_etfs
    user: cripto